[Settings]

; Modifier key: hold it while activating to use a target's alternate action.
; DirectX scan code, see https://ck.uesp.net/wiki/Input_Script (default 42 = Left Shift)
iModifierKey = 42

; Gamepad button for the same thing, in SKSE key numbering (-1 = none). Default 274 = Left Shoulder;
; 275 = Right Shoulder. Full list: https://ck.uesp.net/wiki/Input_Script (gamepad codes 266-281)
iModifierKeyGamepad = 274

; Shown after the activation label when an alternate action is available, e.g. "Give Potion +" (empty = no marker)
sAlternateMarker = +

; When a target has more than one modifier action, they get these buttons while the modifier key is held:
; the first is always Activate, the second and third use these game controls (so your own key bindings,
; keyboard or controller, apply). On a controller the defaults are X and Y; on keyboard R and Space.
; The control does its normal job everywhere else. One of: Ready Weapon, Jump, Sneak, Shout, Auto-Move,
; Toggle Always Run
sSlot2Control = Ready Weapon
sSlot3Control = Jump
