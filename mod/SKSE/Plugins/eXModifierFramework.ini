[Settings]

; Modifier key: hold it while activating to use a target's alternate action.
; DirectX scan code, see https://ck.uesp.net/wiki/Input_Script (default 42 = Left Shift)
iModifierKey = 42

; Gamepad button for the same thing, in SKSE key numbering (-1 = none), e.g. 274 = Left Shoulder,
; 275 = Right Shoulder. Full list: https://ck.uesp.net/wiki/Input_Script (gamepad codes 266-281)
iModifierKeyGamepad = -1

; Shown after the activation label when an alternate action is available, e.g. "Give Potion +"
sAlternateMarker = +
